<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MATHA TN - Học trực tuyến</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET & ROOT ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #078a57;
            --primary-dark: #065f3c;
            --primary-light: #e6f4ee;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        .btn-outline {
            background: transparent;
            border-color: var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            background: var(--bg);
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 6px;
        }
        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }
        .btn-danger:hover {
            background: #fca5a5;
        }
        .btn-warning {
            background: #e0f2fe;
            color: #0284c7;
        }
        .btn-warning:hover {
            background: #bae6fd;
        }
        .btn-google {
            background: #fff;
            border: 1px solid #cbd5e1;
            color: #334155;
            gap: 10px;
            font-weight: 600;
        }
        .btn-google:hover {
            background: #f8fafc;
        }

        /* ===== HEADER ===== */
        header {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand {
            font-size: 24px;
            font-weight: 900;
        }
        .brand em {
            color: var(--primary);
            font-style: normal;
        }
        .brand small {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: var(--muted);
        }
        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-area img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }
        .user-area .name {
            font-weight: 600;
            font-size: 14px;
        }

        /* ===== AUTH ===== */
        #auth-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            gap: 20px;
        }
        #auth-section h2 {
            font-size: 32px;
        }
        #auth-section p {
            color: var(--muted);
            max-width: 400px;
        }

        /* ===== COURSE LIST ===== */
        #course-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }
        .course-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: 0.2s;
            box-shadow: var(--shadow);
            position: relative;
        }
        .course-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .course-card .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .course-card h3 {
            font-size: 18px;
            font-weight: 700;
        }
        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .badge-free {
            background: #dcfce7;
            color: #15803d;
        }
        .badge-premium {
            background: #f3e8ff;
            color: #6b21a8;
        }
        .course-card .desc {
            color: var(--muted);
            font-size: 14px;
            margin: 8px 0 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .course-card .meta {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 14px;
        }
        .course-card .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== COURSE DETAIL ===== */
        #course-detail {
            margin-top: 24px;
        }
        #course-detail .back {
            margin-bottom: 16px;
        }
        #course-detail h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        #course-detail .sub {
            color: var(--muted);
            margin-bottom: 20px;
        }
        .lesson-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .lesson-item .info h4 {
            font-size: 16px;
            font-weight: 600;
        }
        .lesson-item .info .type {
            font-size: 12px;
            background: var(--bg);
            padding: 2px 10px;
            border-radius: 12px;
            color: var(--muted);
        }
        .lesson-item .info .desc {
            font-size: 13px;
            color: var(--muted);
            margin-top: 2px;
        }
        .lesson-item .actions {
            display: flex;
            gap: 6px;
        }

        /* ===== ADMIN PANEL ===== */
        #admin-panel {
            margin-top: 40px;
            border-top: 2px solid var(--border);
            padding-top: 24px;
        }
        #admin-panel .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .admin-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .admin-card h4 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
            height: 60px;
        }
        .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 6px;
        }
        .admin-item:last-child {
            border-bottom: none;
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--muted);
            grid-column: 1 / -1;
        }

        /* ===== FOOTER ===== */
        footer {
            margin-top: auto;
            text-align: center;
            padding: 24px 0;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 13px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            #admin-panel .grid {
                grid-template-columns: 1fr;
            }
            .header-inner {
                flex-direction: column;
                align-items: stretch;
            }
            .user-area {
                justify-content: flex-start;
            }
            #auth-section h2 {
                font-size: 26px;
            }
        }
        @media (max-width: 500px) {
            .course-card .top {
                flex-direction: column;
                gap: 6px;
            }
            .lesson-item {
                flex-direction: column;
                align-items: stretch;
            }
            .lesson-item .actions {
                justify-content: flex-start;
            }
        }

        /* Helper */
        .hidden {
            display: none !important;
        }
        .flex {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .gap-8 {
            gap: 8px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .mb-16 {
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="container header-inner">
            <div class="brand">
                MATHA <em>TN</em>
                <small>Học trực tuyến</small>
            </div>
            <div id="user-area" class="user-area hidden">
                <img id="user-avatar" src="" alt="Avatar" />
                <span id="user-name" class="name"></span>
                <button id="logout-btn" class="btn btn-outline btn-sm">Đăng xuất</button>
                <button id="admin-toggle-btn" class="btn btn-outline btn-sm hidden">👨‍💼 Quản trị</button>
            </div>
            <div id="auth-area">
                <button id="login-btn" class="btn btn-google">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
                    Đăng nhập với Google
                </button>
            </div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main class="container" style="flex:1; padding: 24px 0;">

        <!-- ===== AUTH SECTION ===== -->
        <div id="auth-section">
            <h2>📚 Học toán chưa bao giờ dễ dàng đến thế</h2>
            <p>Đăng nhập bằng Google để bắt đầu hành trình chinh phục toán học cùng hàng ngàn bài giảng chất lượng.</p>
            <button id="auth-login-btn" class="btn btn-google" style="font-size:16px; padding:12px 32px;">
                <svg width="22" height="22" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
                Đăng nhập bằng Google
            </button>
        </div>

        <!-- ===== MAIN CONTENT (sau login) ===== -->
        <div id="main-content" class="hidden">

            <!-- Course List -->
            <div id="course-list"></div>

            <!-- Course Detail -->
            <div id="course-detail" class="hidden">
                <button id="back-btn" class="btn btn-outline btn-sm">← Quay lại</button>
                <h2 id="detail-title"></h2>
                <div id="detail-lessons"></div>

            <!-- Admin Panel -->
            <div id="admin-panel" class="hidden">

                            <div class="form-group">
                                <label>Tên khóa học</label>
                                <input type="text" id="course-title" placeholder="VD: Toán 9 nâng cao" required />
                            </div>
                            <div class="form-group">
                                <label>Loại</label>
                                <select id="course-type">
                                    <option value="free">Miễn phí</option>
                                    <option value="premium">Premium</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Mô tả</label>
                                <textarea id="course-desc" placeholder="Mô tả ngắn về khóa học..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">➕ Thêm khóa học</button>
                        </form>
                        <hr style="margin:20px 0; border-color:var(--border);" />
                        <div id="admin-courses"></div>
                    </div>

                    <!-- Quản lý bài học -->
                    <div class="admin-card">
                        <h4>📖 Quản lý bài học</h4>
                        <form id="lesson-form">
                            <div class="form-group">
                                <label>Khóa học</label>
                                <select id="lesson-course" required></select>
                            </div>
                            <div class="form-group">
                                <label>Tên bài học</label>
                                <input type="text" id="lesson-title" placeholder="VD: Bài 1: Số hữu tỉ" required />
                            </div>
                            <div class="form-group">
                                <label>Loại tài liệu</label>
                                <select id="lesson-type">
                                    <option value="Tài liệu PDF">Tài liệu PDF</option>
                                    <option value="Video bài giảng">Video bài giảng</option>
                                    <option value="Bài tập tự luyện">Bài tập tự luyện</option>
                                    <option value="Đề thi thử">Đề thi thử</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Mô tả</label>
                                <textarea id="lesson-desc" placeholder="Mô tả ngắn..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">➕ Thêm bài học</button>
                        </form>
                        <hr style="margin:20px 0; border-color:var(--border);" />
                        <div id="admin-lessons"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="container">
            © 2026 <strong>MATHA TN</strong>. Nền tảng học toán trực tuyến.
        </div>
    </footer>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        // 1. FIREBASE CONFIG
        // ============================================================
        import { initializeApp } from "firebase/app";
        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            onAuthStateChanged,
            signOut
        } from "firebase/auth";
        import {
            getFirestore,
            collection,
            doc,
            addDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            query,
            orderBy
        } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyBt1O3ZsugN_U21Aa04zlG5ZKdByE4fz-U",
            authDomain: "matha-tn.firebaseapp.com",
            projectId: "matha-tn",
            storageBucket: "matha-tn.firebasestorage.app",
            messagingSenderId: "885676880986",
            appId: "1:885676880986:web:5a306111a618ceebf11463",
            measurementId: "G-K5DXR78RRS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(app);

        // 📧 Admin email (đổi thành email bạn muốn làm admin)
        const ADMIN_EMAIL = "thaigjabao99@gmail.com";

        // ============================================================
        // 2. DOM REFS
        // ============================================================
        const authSection = document.getElementById('auth-section');
        const mainContent = document.getElementById('main-content');
        const userArea = document.getElementById('user-area');
        const userAvatar = document.getElementById('user-avatar');
        const userName = document.getElementById('user-name');
        const loginBtn = document.getElementById('login-btn');
        const authLoginBtn = document.getElementById('auth-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const adminToggleBtn = document.getElementById('admin-toggle-btn');
        const courseList = document.getElementById('course-list');
        const courseDetail = document.getElementById('course-detail');
        const backBtn = document.getElementById('back-btn');
        const detailTitle = document.getElementById('detail-title');
        const detailLessons = document.getElementById('detail-lessons');
        const adminPanel = document.getElementById('admin-panel');
        const adminCourses = document.getElementById('admin-courses');
        const adminLessons = document.getElementById('admin-lessons');
        const lessonCourse = document.getElementById('lesson-course');
        const courseForm = document.getElementById('course-form');
        const lessonForm = document.getElementById('lesson-form');

        let currentUser = null;
        let currentCourseId = null;
        let coursesData = [];
        let lessonsData = [];
        let isAdmin = false;

        // ============================================================
        // 3. RENDER FUNCTIONS
        // ============================================================
        function renderCourses() {
            if (!coursesData.length) {
                courseList.innerHTML = `<div class="empty-state">📭 Chưa có khóa học nào. Hãy đăng nhập với Admin để thêm.</div>`;
                return;
            }
            let html = '';
            coursesData.forEach(c => {
                const count = lessonsData.filter(l => l.courseId === c.id).length;
                const badgeClass = c.type === 'free' ? 'badge-free' : 'badge-premium';
                html += `
                    <div class="course-card" data-id="${c.id}">
                        <div class="top">
                            <h3>${c.title}</h3>
                            <span class="badge ${badgeClass}">${c.type === 'free' ? 'Miễn phí' : 'Premium'}</span>
                        </div>
                        <p class="desc">${c.desc || ''}</p>
                        <div class="meta">📚 ${count} bài học</div>
                        <div class="actions">
                            <button class="btn btn-primary btn-sm view-btn" data-id="${c.id}">Xem chi tiết</button>
                            ${isAdmin ? `
                                <button class="btn btn-warning btn-sm edit-course-btn" data-id="${c.id}">✏️</button>
                                <button class="btn btn-danger btn-sm delete-course-btn" data-id="${c.id}">🗑</button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
            courseList.innerHTML = html;

            // Sự kiện
            courseList.querySelectorAll('.view-btn').forEach(b => {
                b.addEventListener('click', () => showDetail(b.dataset.id));
            });
            if (isAdmin) {
                courseList.querySelectorAll('.delete-course-btn').forEach(b => {
                    b.addEventListener('click', () => deleteCourse(b.dataset.id));
                });
                courseList.querySelectorAll('.edit-course-btn').forEach(b => {
                    b.addEventListener('click', () => editCourse(b.dataset.id));
                });
            }
        }

        function renderLessons(lessons) {
            if (!lessons.length) {
                detailLessons.innerHTML = `<div class="empty-state">📭 Chưa có bài học nào cho khóa học này.</div>`;
                return;
            }
            let html = '';
            lessons.forEach(l => {
                html += `
                    <div class="lesson-item">
                        <div class="info">
                            <h4>${l.title}</h4>
                            <span class="type">${l.type || 'Tài liệu'}</span>
                            <p class="desc">${l.desc || ''}</p>
                        </div>
                        ${isAdmin ? `
                            <div class="actions">
                                <button class="btn btn-warning btn-sm edit-lesson-btn" data-id="${l.id}">✏️</button>
                                <button class="btn btn-danger btn-sm delete-lesson-btn" data-id="${l.id}">🗑</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            detailLessons.innerHTML = html;
            if (isAdmin) {
                detailLessons.querySelectorAll('.delete-lesson-btn').forEach(b => {
                    b.addEventListener('click', () => deleteLesson(b.dataset.id));
                });
                detailLessons.querySelectorAll('.edit-lesson-btn').forEach(b => {
                    b.addEventListener('click', () => editLesson(b.dataset.id));
                });
            }
        }

        function renderAdminCourses() {
            if (!coursesData.length) {
                adminCourses.innerHTML = `<div class="empty-state">Chưa có khóa học nào.</div>`;
                return;
            }
            let html = '';
            coursesData.forEach(c => {
                html += `
                    <div class="admin-item">
                        <span><strong>${c.title}</strong> (${c.type})</span>
                        <div>
                            <button class="btn btn-warning btn-sm edit-course-btn" data-id="${c.id}">Sửa</button>
                            <button class="btn btn-danger btn-sm delete-course-btn" data-id="${c.id}">Xóa</button>
                        </div>
                    </div>
                `;
            });
            adminCourses.innerHTML = html;
            adminCourses.querySelectorAll('.delete-course-btn').forEach(b => {
                b.addEventListener('click', () => deleteCourse(b.dataset.id));
            });
            adminCourses.querySelectorAll('.edit-course-btn').forEach(b => {
                b.addEventListener('click', () => editCourse(b.dataset.id));
            });
        }

        function renderAdminLessons() {
            if (!lessonsData.length) {
                adminLessons.innerHTML = `<div class="empty-state">Chưa có bài học nào.</div>`;
                return;
            }
            let html = '';
            lessonsData.forEach(l => {
                const course = coursesData.find(c => c.id === l.courseId);
                html += `
                    <div class="admin-item">
                        <span><strong>${l.title}</strong> (${course ? course.title : 'Không xác định'})</span>
                        <div>
                            <button class="btn btn-warning btn-sm edit-lesson-btn" data-id="${l.id}">Sửa</button>
                            <button class="btn btn-danger btn-sm delete-lesson-btn" data-id="${l.id}">Xóa</button>
                        </div>
                    </div>
                `;
            });
            adminLessons.innerHTML = html;
            adminLessons.querySelectorAll('.delete-lesson-btn').forEach(b => {
                b.addEventListener('click', () => deleteLesson(b.dataset.id));
            });
            adminLessons.querySelectorAll('.edit-lesson-btn').forEach(b => {
                b.addEventListener('click', () => editLesson(b.dataset.id));
            });
        }

        function showDetail(courseId) {
            currentCourseId = courseId;
            const course = coursesData.find(c => c.id === courseId);
            if (!course) return;
            detailTitle.textContent = course.title;
            const lessons = lessonsData.filter(l => l.courseId === courseId);
            renderLessons(lessons);
            courseList.style.display = 'none';
            courseDetail.classList.remove('hidden');
            backBtn.classList.remove('hidden');
        }

        function hideDetail() {
            courseList.style.display = 'grid';
            courseDetail.classList.add('hidden');
            backBtn.classList.add('hidden');
            currentCourseId = null;
        }

        // ============================================================
        // 4. CRUD OPERATIONS
        // ============================================================
        async function addCourse(e) {
            e.preventDefault();
            const title = document.getElementById('course-title').value.trim();
            const type = document.getElementById('course-type').value;
            const desc = document.getElementById('course-desc').value.trim();
            if (!title) return alert('Vui lòng nhập tên khóa học');
            try {
                await addDoc(collection(db, 'courses'), {
                    title,
                    type,
                    desc,
                    createdAt: new Date()
                });
                document.getElementById('course-title').value = '';
                document.getElementById('course-desc').value = '';
                alert('✅ Thêm khóa học thành công!');
            } catch (err) {
                alert('❌ Lỗi: ' + err.message);
            }
        }

        async function deleteCourse(id) {
            if (!confirm('Xóa khóa học này và tất cả bài học?')) return;
            try {
                const lessons = lessonsData.filter(l => l.courseId === id);
                for (let l of lessons) {
                    await deleteDoc(doc(db, 'lessons', l.id));
                }
                await deleteDoc(doc(db, 'courses', id));
                alert('✅ Đã xóa khóa học và bài học.');
            } catch (err) {
                alert('❌ Lỗi: ' + err.message);
            }
        }

        function editCourse(id) {
            const course = coursesData.find(c => c.id === id);
            if (!course) return;
            document.getElementById('course-title').value = course.title;
            document.getElementById('course-type').value = course.type;
            document.getElementById('course-desc').value = course.desc || '';
            // Thay đổi hành động form
            const oldSubmit = courseForm.onsubmit;
            courseForm.onsubmit = async (e) => {
                e.preventDefault();
                const updated = {
                    title: document.getElementById('course-title').value.trim(),
                    type: document.getElementById('course-type').value,
                    desc: document.getElementById('course-desc').value.trim()
                };
                try {
                    await updateDoc(doc(db, 'courses', id), updated);
                    alert('✅ Cập nhật thành công!');
                    courseForm.onsubmit = oldSubmit;
                    document.getElementById('course-title').value = '';
                    document.getElementById('course-desc').value = '';
                } catch (err) {
                    alert('❌ Lỗi: ' + err.message);
                }
            };
            courseForm.dispatchEvent(new Event('submit'));
        }

        async function addLesson(e) {
            e.preventDefault();
            const courseId = document.getElementById('lesson-course').value;
            const title = document.getElementById('lesson-title').value.trim();
            const type = document.getElementById('lesson-type').value;
            const desc = document.getElementById('lesson-desc').value.trim();
            if (!courseId) return alert('Vui lòng chọn khóa học');
            if (!title) return alert('Vui lòng nhập tên bài học');
            try {
                await addDoc(collection(db, 'lessons'), {
                    courseId,
                    title,
                    type,
                    desc,
                    createdAt: new Date()
                });
                document.getElementById('lesson-title').value = '';
                document.getElementById('lesson-desc').value = '';
                alert('✅ Thêm bài học thành công!');
            } catch (err) {
                alert('❌ Lỗi: ' + err.message);
            }
        }

        async function deleteLesson(id) {
            if (!confirm('Xóa bài học này?')) return;
            try {
                await deleteDoc(doc(db, 'lessons', id));
                alert('✅ Đã xóa bài học.');
            } catch (err) {
                alert('❌ Lỗi: ' + err.message);
            }
        }

        function editLesson(id) {
            const lesson = lessonsData.find(l => l.id === id);
            if (!lesson) return;
            document.getElementById('lesson-title').value = lesson.title;
            document.getElementById('lesson-type').value = lesson.type || 'Tài liệu';
            document.getElementById('lesson-desc').value = lesson.desc || '';
            const oldSubmit = lessonForm.onsubmit;
            lessonForm.onsubmit = async (e) => {
                e.preventDefault();
                const updated = {
                    title: document.getElementById('lesson-title').value.trim(),
                    type: document.getElementById('lesson-type').value,
                    desc: document.getElementById('lesson-desc').value.trim()
                };
                try {
                    await updateDoc(doc(db, 'lessons', id), updated);
                    alert('✅ Cập nhật thành công!');
                    lessonForm.onsubmit = oldSubmit;
                    document.getElementById('lesson-title').value = '';
                    document.getElementById('lesson-desc').value = '';
                } catch (err) {
                    alert('❌ Lỗi: ' + err.message);
                }
            };
            lessonForm.dispatchEvent(new Event('submit'));
        }

        // ============================================================
        // 5. AUTH & UI
        // ============================================================
        function updateUI(user) {
            if (user) {
                currentUser = user;
                isAdmin = user.email === ADMIN_EMAIL;
                authSection.classList.add('hidden');
                mainContent.classList.remove('hidden');
                userArea.classList.remove('hidden');
                userAvatar.src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName)}`;
                userName.textContent = user.displayName;
                if (isAdmin) {
                    adminToggleBtn.classList.remove('hidden');
                    adminPanel.classList.remove('hidden');
                } else {
                    adminToggleBtn.classList.add('hidden');
                    adminPanel.classList.add('hidden');
                }
                // Lắng nghe dữ liệu
                listenData();
            } else {
                currentUser = null;
                isAdmin = false;
                authSection.classList.remove('hidden');
                mainContent.classList.add('hidden');
                userArea.classList.add('hidden');
                adminToggleBtn.classList.add('hidden');
                adminPanel.classList.add('hidden');
                courseList.innerHTML = '';
                detailLessons.innerHTML = '';
                coursesData = [];
                lessonsData = [];
                // Hủy listeners? không cần thiết vì onSnapshot sẽ tự hủy khi gắn lại
            }
        }

        function listenData() {
            // Courses
            const qCourses = query(collection(db, 'courses'), orderBy('createdAt', 'asc'));
            onSnapshot(qCourses, (snapshot) => {
                coursesData = [];
                snapshot.forEach(doc => {
                    coursesData.push({ id: doc.id, ...doc.data() });
                });
                if (currentUser) {
                    renderCourses();
                    renderAdminCourses();
                    // Cập nhật dropdown lesson
                    const select = document.getElementById('lesson-course');
                    select.innerHTML = coursesData.map(c => `<option value="${c.id}">${c.title}</option>`).join('');
                    if (currentCourseId) {
                        const lessons = lessonsData.filter(l => l.courseId === currentCourseId);
                        renderLessons(lessons);
                    }
                }
            });

            // Lessons
            const qLessons = query(collection(db, 'lessons'), orderBy('createdAt', 'asc'));
            onSnapshot(qLessons, (snapshot) => {
                lessonsData = [];
                snapshot.forEach(doc => {
                    lessonsData.push({ id: doc.id, ...doc.data() });
                });
                if (currentUser) {
                    renderAdminLessons();
                    if (currentCourseId) {
                        const lessons = lessonsData.filter(l => l.courseId === currentCourseId);
                        renderLessons(lessons);
                    }
                    renderCourses(); // cập nhật số bài học trên card
                }
            });
        }

        // ============================================================
        // 6. AUTH ACTIONS
        // ============================================================
        async function loginGoogle() {
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                console.error(err);
                alert('Đăng nhập thất bại: ' + err.message);
            }
        }

        async function logout() {
            if (!confirm('Bạn có chắc muốn đăng xuất?')) return;
            try {
                await signOut(auth);
            } catch (err) {
                alert('Lỗi đăng xuất: ' + err.message);
            }
        }

        // ============================================================
        // 7. EVENT LISTENERS
        // ============================================================
        loginBtn.addEventListener('click', loginGoogle);
        authLoginBtn.addEventListener('click', loginGoogle);
        logoutBtn.addEventListener('click', logout);
        backBtn.addEventListener('click', hideDetail);

        adminToggleBtn.addEventListener('click', () => {
            adminPanel.classList.toggle('hidden');
        });

        courseForm.addEventListener('submit', addCourse);
        lessonForm.addEventListener('submit', addLesson);

        // Auth state
        onAuthStateChanged(auth, (user) => {
            updateUI(user);
        });

        // ============================================================
        // 8. INIT
        // ============================================================
        // Mặc định ẩn main
        mainContent.classList.add('hidden');
        userArea.classList.add('hidden');
        adminToggleBtn.classList.add('hidden');
        adminPanel.classList.add('hidden');
        backBtn.classList.add('hidden');
        courseDetail.classList.add('hidden');

        console.log('🚀 MATHA TN đã sẵn sàng!');
        console.log('👑 Admin email: ' + ADMIN_EMAIL);
    </script>
</body>
</html>
